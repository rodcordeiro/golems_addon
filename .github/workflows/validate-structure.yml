name: Validate Bedrock Structure

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate-gollem-addon:
    name: Validate Gollem Addon Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check required folders
        run: |
          test -d addon/gollem_addon/behavior_pack || (echo "Missing behavior_pack" && exit 1)
          test -d addon/gollem_addon/resource_pack || (echo "Missing resource_pack" && exit 1)

      - name: Check manifests
        run: |
          test -f addon/gollem_addon/behavior_pack/manifest.json || exit 1
          test -f addon/gollem_addon/resource_pack/manifest.json || exit 1

      - name: Validate manifest identifiers
        run: |
          jq -e '.header.uuid != null' addon/gollem_addon/behavior_pack/manifest.json
          jq -e '.header.uuid != null' addon/gollem_addon/resource_pack/manifest.json

  validate-villagers-addon:
    name: Validate Villagers Addon Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check required folders
        run: |
          test -d addon/villagers_addon/behavior_pack || (echo "Missing behavior_pack" && exit 1)
          test -d addon/villagers_addon/resource_pack || (echo "Missing resource_pack" && exit 1)

      - name: Check manifests
        run: |
          test -f addon/villagers_addon/behavior_pack/manifest.json || exit 1
          test -f addon/villagers_addon/resource_pack/manifest.json || exit 1

      - name: Validate manifest identifiers
        run: |
          jq -e '.header.uuid != null' addon/villagers_addon/behavior_pack/manifest.json
          jq -e '.header.uuid != null' addon/villagers_addon/resource_pack/manifest.json
