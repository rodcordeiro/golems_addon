name: Build mcaddon

on:
  push:
    branches: [ main ]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Prepare gollem build folder
        run: |
          mkdir -p build/gollem
          cp -r gollem_addon/behavior_pack build/gollem/
          cp -r gollem_addon/resource_pack build/gollem/

      - name: Prepare villagers_addon build folder
        run: |
          mkdir -p build/villagers
          cp -r villagers_addon/behavior_pack build/villagers/
          cp -r villagers_addon/resource_pack build/villagers/

      - name: Create mcaddon packages
        run: |
          (cd build/gollem && zip -r "../../stone_golems.${VERSION}.mcaddon" behavior_pack resource_pack)
          (cd build/villagers && zip -r "../../villagers_addon.${VERSION}.mcaddon" behavior_pack resource_pack)
          ls -la *.mcaddon

      - name: Upload gollem artifact
        uses: actions/upload-artifact@v7
        with:
          name: stone-golems-mcaddon
          path: stone_golems.${{ env.VERSION }}.mcaddon

      - name: Upload villagers_addon artifact
        uses: actions/upload-artifact@v7
        with:
          name: villagers-addon-mcaddon
          path: villagers_addon.${{ env.VERSION }}.mcaddon

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            stone_golems.${{ env.VERSION }}.mcaddon
            villagers_addon.${{ env.VERSION }}.mcaddon
